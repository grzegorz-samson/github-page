name: Deploy to Public Site Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.PAGES_REPO_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build public site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /
        run: npm run build
      - name: Publish dist to grzegorz-samson.github.io
        shell: bash
        env:
          PAGES_REPO_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${PAGES_REPO_TOKEN}@github.com/grzegorz-samson/grzegorz-samson.github.io.git" ../pages-repo
          find ../pages-repo -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a dist/. ../pages-repo/
          touch ../pages-repo/.nojekyll
          cd ../pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy from github-page@${GITHUB_SHA::7}"
          git push origin main

  deploy-skipped:
    if: ${{ secrets.PAGES_REPO_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Missing deploy token
        run: echo "Set PAGES_REPO_TOKEN in repository secrets to enable deploys to grzegorz-samson.github.io."

